<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأستاذ علي داخل السعيدي | مدرس اللغة العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2142;--ink2:#18306a;--brass:#d2a94e;--bg:#eef2f9;--card:#fff;--text:#12203d;--muted:#52607a;--line:#d9e0ee;--wa:#1faa59;--btn-text:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#122046;--text:#eef2fb;--muted:#a7b3cf;--line:#24366a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#122046;--text:#eef2fb;--muted:#a7b3cf;--line:#24366a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:0 0 32px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ink2),var(--ink) 70%);color:#fff;text-align:center;padding:44px 24px 72px;border-radius:0 0 36px 36px}
.hero::before{content:"ع";position:absolute;left:-30px;top:-60px;font-family:"Reem Kufi",Tahoma,sans-serif;font-weight:700;font-size:340px;line-height:1;color:#fff;opacity:.06;pointer-events:none}
.photo{position:relative;width:148px;height:148px;margin:0 auto 20px;border-radius:50%;padding:4px;background:var(--brass);animation:pop .7s ease-out both}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
h1{margin:0;font-family:"Reem Kufi",Tahoma,sans-serif;font-weight:700;font-size:32px;line-height:1.35}
.role{margin:6px 0 0;font-size:18px;font-weight:500;color:var(--brass)}
.grade{display:inline-block;margin-top:14px;padding:5px 16px;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:15px}
.panel{position:relative;margin:-40px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px}
.panel h2{margin:0 0 12px;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:20px;font-weight:700}
.schools{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.schools li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:14px;font-weight:500}
.schools svg{flex:none;width:22px;height:22px;color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .schools svg{color:var(--brass)}}
:root[data-theme="dark"] .schools svg{color:var(--brass)}
.actions{display:grid;gap:12px;margin:18px 18px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:12px 20px;border-radius:18px;font:600 18px/1.3 "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--btn-text);text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.btn svg{width:26px;height:26px;flex:none}
.wa{background:var(--wa)}
.tel{background:var(--ink2)}
.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.num{margin:20px 18px 0;text-align:center;color:var(--muted);font-size:16px}
.num bdi{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--text);letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){.photo{animation:none}.btn{transition:none}}
</style>
</head>
